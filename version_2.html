  .grid-container {

    grid-template-rows: repeat(3, 1fr);

    flex: 1;

  .section { text-align: center; position: relative; }
  .section-label { font-size: 8pt; color: #444; margin-bottom: 2px; font-weight: bold; }
  
  .axis-line {

    height: 125px;

const getCoord5 = (i) => 10 + i * 30;

const dots5x5HTML = () => {
  let dots = '';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      // 点の半径を 2 -> 4 に大きく変更
      dots += `<circle cx="${getCoord5(c)}" cy="${getCoord5(r)}" r="4" fill="#000"/>`;
    }
  }
  return dots;
};

// 実線描画（線の太さも標準化）
const drawSolidLines = (lines) => {
  return lines.map(l => {
    const x1 = getCoord5(l[0]), y1 = getCoord5(l[1]);
    const x2 = getCoord5(l[2]), y2 = getCoord5(l[3]);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="3" stroke-linecap="round"/>`;
  }).join('');
};
