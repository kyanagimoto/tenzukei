<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>りのすけ てんずけい 10x10 線対称（ひたいしょう図形）全10枚セット</title>
<style>
  @page {
    size: A4 portrait;
    margin: 6mm;
  }
  
  * {
    box-sizing: border-box;
  }

  body {
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
    margin: 0;
    padding: 0;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  
  .page {
    width: 100%;
    height: 284mm;
    page-break-after: always;
    break-after: page;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  header {
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .title { font-size: 15pt; font-weight: bold; }
  .name-box { 
    font-size: 11pt; 
    border: 1.5px solid #000; 
    border-radius: 4px;
    width: 90mm;
    height: 32px;
    display: flex;
    align-items: center;
    padding-left: 10px;
  }
  .subtitle { text-align: center; font-size: 8.5pt; margin-bottom: 4px; font-weight: bold; }
  
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    flex: 1;
  }
  
  .problem-box {
    border: 1.5px solid #333;
    border-radius: 6px;
    padding: 4px;
    display: flex;
    flex-direction: column;
  }
  
  .problem-title { font-weight: bold; font-size: 9pt; border-bottom: 1px dashed #ccc; padding-bottom: 2px; margin-bottom: 2px; }
  .content { display: flex; justify-content: space-around; align-items: center; flex: 1; padding: 0; }
  .section { text-align: center; position: relative; }
  .section-label { font-size: 8pt; color: #444; margin-bottom: 2px; font-weight: bold; }
  
  .axis-line {
    width: 2px;
    height: 125px;
    margin: 0 2px;
    border-left: 2px dashed #e63946;
  }

  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>

<script>
// 10x10 の点（140x140キャンバス内に10x10配置）
// 座標: 5, 19, 33, 47, 61, 75, 89, 103, 117, 131
const getCoord10 = (i) => 5 + i * 14;

const dots10x10HTML = () => {
  let dots = '';
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      dots += `<circle cx="${getCoord10(c)}" cy="${getCoord10(r)}" r="2" fill="#000"/>`;
    }
  }
  return dots;
};

// 10x10格子のグリッド座標 (0~9) から SVG座標への変換
const drawLines10 = (lines) => {
  return lines.map(l => {
    const x1 = getCoord10(l[0]), y1 = getCoord10(l[1]);
    const x2 = getCoord10(l[2]), y2 = getCoord10(l[3]);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>`;
  }).join('');
};

      <div class="problem-box">
