<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>用のてんずけい</title>
<style>
  @page {
    size: A4 portrait;
    margin: 6mm;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    width: 198mm;
    height: 285mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sheet-heading {
    height: 12mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2mm;
    border-bottom: 1.2px solid #222;
  }

  .sheet-title {
    font-size: 13pt;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .name-line {
    font-size: 10pt;
    min-width: 58mm;
    padding-bottom: 1mm;
    border-bottom: 1px solid #222;
  }

  .problems {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2.5mm;
    padding-top: 2.5mm;
    min-height: 0;
  }

  .problem {
    min-width: 0;
    min-height: 0;
    border: 1.2px solid #222;
    padding: 2.5mm 2mm 2mm;
    display: flex;
    flex-direction: column;
  }

  .problem-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    height: 7mm;
    padding: 0 1mm;
    border-bottom: 1px dashed #999;
  }

  .problem-number {
    font-size: 10pt;
    font-weight: 700;
  }

  .problem-kind {
    color: #555;
    font-size: 7.5pt;
  }

  .copy-area {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    align-items: center;
    column-gap: 1.5mm;
  }

  .answer-divider {
    height: 76%;
    border-left: 1px solid #777;
  }

  .figure {
    min-width: 0;
    text-align: center;
  }

  .figure-label {
    height: 6mm;
    color: #333;
    font-size: 8pt;
    font-weight: 700;
  }

  svg {
    display: block;
    width: min(100%, 43mm);
    height: auto;
    margin: 0 auto;
  }

  .top-problem svg { width: min(100%, 42mm); }
  .bottom-problem svg { width: min(100%, 44mm); }

  .instruction {
    height: 10mm;
    display: flex;
    align-items: center;
    padding: 1mm 2mm 0;
    font-size: 7.5pt;
  }

  .instruction::before {
    content: "※ ";
    font-weight: 700;
  }

  @media screen {
    body { background: #e8e8e8; }
    .page {
      margin: 10px auto;
      padding: 0;
      background: #fff;
      box-shadow: 0 1px 10px rgba(0, 0, 0, .18);
    }
  }

  @media print {
    .page { page-break-after: always; }
    .page:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="pages"></div>

<script>
  const studentName = "りのすけ";
  document.title = `${studentName}${document.title}`;

  const topGrid = [12, 36, 60, 84, 108];
  const bottomGrid = [6, 18, 30, 42, 54, 66, 78, 90, 102, 114];

  const topDots = () => topGrid.flatMap(y => topGrid.map(x =>
    `<circle cx="${x}" cy="${y}" r="1.8" fill="#222"/>`
  )).join('');

  const topGridLines = () => {
    const lines = topGrid.map(value =>
      `<line x1="${value}" y1="4" x2="${value}" y2="116"/>`
    ).join('') + topGrid.map(value =>
      `<line x1="4" y1="${value}" x2="116" y2="${value}"/>`
    ).join('');
    return `<g stroke="#aaa" stroke-width="0.7" stroke-dasharray="2.2 2.2">${lines}</g>`;
  };

  const bottomDots = () => bottomGrid.flatMap(y => bottomGrid.map(x =>
    `<circle cx="${x}" cy="${y}" r="1.65" fill="#222"/>`
  )).join('');

  const drawLines = lines => lines.map(([x1, y1, x2, y2]) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>`
  ).join('');

  const topFigure = lines => `
    <svg viewBox="0 0 120 120" aria-label="方眼上のお手本">
      ${topGridLines()}
      ${drawLines(lines)}
      ${topDots()}
    </svg>`;

  const bottomFigure = lines => `
    <svg viewBox="0 0 120 120" aria-label="点図形のお手本">
      ${drawLines(lines)}
      ${bottomDots()}
    </svg>`;

  const blankTop = `
    <svg viewBox="0 0 120 120" aria-label="方眼の解答欄">
      ${topGridLines()}
      ${topDots()}
    </svg>`;

  const blankBottom = `
    <svg viewBox="0 0 120 120" aria-label="点図形の解答欄">
      ${bottomDots()}
    </svg>`;

  const path = (points, close = false) => {
    const lines = points.slice(0, -1).map((point, index) => [
      point[0], point[1], points[index + 1][0], points[index + 1][1]
    ]);
    if (close) {
      lines.push([points[points.length - 1][0], points[points.length - 1][1], points[0][0], points[0][1]]);
    }
    return lines;
  };

  const pages = [
    {
      top: [
        [[12,36,60,36],[60,36,60,84],[60,84,12,84],[12,84,12,36],[12,36,36,12],[36,12,84,12],[84,12,60,36],[60,84,84,60],[84,12,84,60]],
        [[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[12,84,12,36],[12,36,36,12],[36,12,60,36],[60,36,60,84],[36,12,36,60]]
      ],
      bottom: [
        path([[18,18],[54,18],[54,54],[30,54],[30,78],[66,78],[66,102],[42,102],[42,90],[18,90]], true),
          path([[18,66],[30,54],[42,66],[54,54],[66,66],[78,54],[90,66],[78,78],[90,90],[78,102],[54,102],[54,90],[42,90],[30,102],[18,90],[30,78]], true)
      ]
    },
    {
      top: [
        [[12,60,36,36],[36,36,84,36],[84,36,84,84],[84,84,36,84],[36,84,12,60],[36,36,36,84],[60,36,60,84]],
        [[12,84,60,84],[60,84,84,60],[84,60,84,12],[84,12,36,12],[36,12,12,36],[12,36,12,84],[36,12,36,60],[36,60,60,84]]
      ],
      bottom: [
        path([[18,30],[42,18],[66,30],[66,54],[90,54],[90,78],[66,78],[66,102],[42,102],[42,78],[18,78]], true),
        path([[18,90],[30,78],[42,90],[54,78],[66,90],[78,78],[90,90],[78,102],[66,90],[54,102],[42,90],[30,102]], true)
      ]
    },
    {
      top: [
        [[12,84,12,36],[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[36,12,36,60],[36,60,60,84]],
        [[12,36,36,12],[36,12,60,36],[60,36,84,12],[84,12,84,60],[84,60,60,84],[60,84,36,60],[36,60,12,84],[12,84,12,36],[36,60,36,12]]
      ],
      bottom: [
        path([[18,18],[42,18],[42,42],[66,42],[66,66],[90,66],[90,90],[66,90],[66,114],[42,114],[42,90],[18,90]], true),
        path([[18,54],[30,42],[42,54],[54,42],[66,54],[78,42],[90,54],[78,66],[90,78],[78,90],[66,78],[54,90],[42,78],[30,90],[18,78],[30,66]], true)
      ]
    },
    {
      top: [
        [[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[12,84,12,36],[36,12,36,60],[36,60,60,84],[60,36,84,60]],
        [[12,60,36,36],[36,36,60,60],[60,60,84,36],[84,36,84,84],[84,84,12,84],[12,84,12,60],[36,36,36,84],[60,60,60,12]]
      ],
      bottom: [
        path([[18,18],[42,18],[42,42],[78,42],[78,18],[102,18],[102,54],[90,54],[90,78],[66,78],[66,102],[42,102],[42,114],[18,114]], true),
        path([[18,66],[30,54],[42,66],[54,54],[66,66],[78,54],[90,66],[78,78],[90,90],[78,102],[66,90],[54,102],[42,90],[30,102],[18,90],[30,78]], true)
      ]
    },
    {
      top: [
        [[12,60,36,36],[36,36,36,84],[36,84,12,84],[12,84,12,60],[36,36,60,12],[60,12,84,36],[84,36,84,84],[84,84,36,84],[60,12,60,60],[60,60,84,36]],
        [[12,12,60,12],[60,12,84,36],[84,36,84,84],[84,84,36,84],[36,84,12,60],[12,60,12,12],[36,12,36,60],[36,60,60,60],[60,60,84,36]]
      ],
      bottom: [
        path([[18,30],[30,18],[42,30],[54,18],[66,30],[78,18],[90,30],[78,42],[90,54],[78,66],[90,78],[78,90],[66,78],[54,90],[42,78],[30,90],[18,78],[30,66],[18,54],[30,42]], true),
          path([[18,90],[30,78],[42,90],[54,78],[66,90],[78,78],[90,90],[78,102],[66,90],[54,102],[42,90],[30,102],[30,114],[18,102]], true)
      ]
    },
    {
      top: [
        [[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[12,84,12,36],[36,12,36,60],[36,60,60,84],[60,12,60,60]],
        [[12,84,12,36],[12,36,60,36],[60,36,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[36,36,36,84],[60,36,60,84]]
      ],
      bottom: [
        path([[18,18],[66,18],[66,42],[90,42],[90,66],[66,66],[66,90],[42,90],[42,114],[18,114]], true),
        path([[18,54],[42,54],[42,30],[66,30],[66,54],[90,54],[90,78],[66,78],[66,102],[42,102],[42,78],[18,78]], true)
      ]
    },
    {
      top: [
        [[12,12,60,12],[60,12,84,36],[84,36,84,84],[84,84,36,84],[36,84,12,60],[12,60,12,12],[36,12,36,60],[36,60,60,84],[60,12,60,60]],
        [[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[12,84,12,36],[36,36,60,60],[60,60,84,36],[36,36,36,84]]
      ],
      bottom: [
        path([[18,42],[30,30],[42,42],[54,30],[66,42],[78,30],[90,42],[78,54],[90,66],[78,78],[90,90],[78,102],[66,90],[54,102],[42,90],[30,102],[18,90],[30,78],[18,66],[30,54]], true),
        path([[18,18],[42,18],[42,30],[66,30],[66,54],[90,54],[90,78],[78,78],[78,102],[54,102],[54,114],[30,114],[30,90],[18,90]], true)
      ]
    },
    {
      top: [
        [[12,60,36,36],[36,36,60,12],[60,12,84,36],[84,36,84,84],[84,84,60,60],[60,60,36,84],[36,84,12,84],[12,84,12,60],[36,36,60,60]],
        [[12,84,12,36],[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[36,12,36,60],[36,60,60,84],[60,36,84,60]]
      ],
      bottom: [
        path([[18,18],[42,18],[42,42],[54,42],[54,66],[78,66],[78,90],[102,90],[102,114],[78,114],[78,102],[54,102],[54,90],[30,90],[30,66],[18,66]], true),
        path([[18,78],[30,66],[42,78],[54,66],[66,78],[78,66],[90,78],[78,90],[90,102],[66,102],[66,90],[54,102],[42,90],[30,102],[18,102]], true)
      ]
    },
    {
      top: [
        [[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[12,84,12,36],[36,12,36,60],[36,60,60,84],[60,12,84,36]],
          [[12,12,36,36],[36,36,60,12],[60,12,84,36],[84,36,60,60],[60,60,84,84],[84,84,12,84],[12,84,12,12],[36,36,36,84],[60,12,60,60]]
      ],
      bottom: [
        path([[18,30],[42,18],[66,30],[66,42],[90,42],[90,66],[78,66],[78,90],[54,90],[54,114],[30,114],[30,90],[18,90]], true),
        path([[18,90],[30,78],[42,90],[54,78],[66,90],[78,78],[90,90],[78,102],[66,90],[54,102],[42,90],[30,102],[30,114],[18,102],[18,78]], true)
      ]
    },
    {
      top: [
        [[12,12,60,12],[60,12,84,36],[84,36,84,84],[84,84,36,84],[36,84,12,60],[12,60,12,12],[36,12,36,60],[36,60,60,84],[60,12,60,60],[60,60,84,36]],
        [[12,84,12,36],[12,36,36,12],[36,12,84,12],[84,12,84,60],[84,60,60,84],[60,84,12,84],[36,12,36,84],[60,36,84,60]]
      ],
      bottom: [
          path([[18,18],[42,18],[42,30],[66,30],[66,54],[90,54],[90,78],[66,78],[66,102],[42,102],[42,114],[18,114]], true),
          path([[18,54],[30,42],[42,54],[54,42],[66,54],[78,42],[90,54],[78,66],[90,78],[78,90],[66,78],[54,90],[42,78],[30,90],[18,78],[30,66],[42,66],[54,78]], true)
      ]
    }
  ];

  const renderProblem = (sample, type, index) => `
    <section class="problem ${type}">
      <div class="problem-heading">
        <div class="problem-number">${index + 1} もん</div>
        <div class="problem-kind">${type === 'top-problem' ? 'ほうがん・りったい' : 'てんずけい・きほん'}</div>
      </div>
      <div class="copy-area">
        <div class="figure">
          <div class="figure-label">【おてほん】</div>
          ${type === 'top-problem' ? topFigure(sample) : bottomFigure(sample)}
        </div>
        <div class="answer-divider" aria-hidden="true"></div>
        <div class="figure">
          <div class="figure-label">【かくところ】</div>
          ${type === 'top-problem' ? blankTop : blankBottom}
        </div>
      </div>
    </section>`;

  const renderPage = (page, pageIndex) => {
    const problems = [
      renderProblem(page.top[0], 'top-problem', 0),
      renderProblem(page.top[1], 'top-problem', 1),
      renderProblem(page.bottom[0], 'bottom-problem', 2),
      renderProblem(page.bottom[1], 'bottom-problem', 3)
    ].join('');

    return `
      <div class="page">
        <header class="sheet-heading">
          <div class="sheet-title">${studentName}用のてんずけい　${pageIndex + 1}</div>
          <div class="name-line">なまえ：</div>
        </header>
        <main class="problems">${problems}</main>
        <div class="instruction">ひだりの おてほんを よくみて、みぎの てんや ほうがんの うえに おなじ ずけいを かきましょう。</div>
      </div>`;
  };

  document.getElementById('pages').innerHTML = pages.map(renderPage).join('');
</script>
</body>
</html>
