    margin: 0;
    padding: 0;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  
  .page {
    width: 100%;
    height: 284mm;
    page-break-after: always;
    break-after: page;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  header {
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .title { font-size: 16pt; font-weight: bold; }
  .name-box {

    border-radius: 4px;

    height: 32px;
    display: flex;
    align-items: center;
    padding-left: 10px;
  }
  .subtitle { text-align: center; font-size: 9pt; margin-bottom: 6px; font-weight: bold; }
  
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    flex: 1;
  }
  
  .problem-box {
    border: 1.5px solid #333;
    border-radius: 6px;
    padding: 6px;
    display: flex;
    flex-direction: column;
  }

  .section { text-align: center; position: relative; }
  .section-label { font-size: 8.5pt; color: #444; margin-bottom: 2px; font-weight: bold; }
  
  .axis-line {
    width: 2px;
    height: 125px;
    margin: 0 2px;
  }
  .axis-line.dashed {
    border-left: 2px dashed #e63946;
  }
  .axis-line.solid {
    border-left: 2px solid #ccc;
  }

  svg { display: block; margin: 0 auto; }
</style>
</head>

const studentName = "りのすけ";

// 5x5 の点（140x140のキャンバス内に配置: 10, 40, 70, 100, 130）
const dotsHTML = () => {
  let dots = '';
  const coords = [10, 40, 70, 100, 130];
  coords.forEach(y => {
    coords.forEach(x => {
      dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="#000"/>`;
    });
  });
  return dots;
};

// 座標マッピング関数 (15~115 -> 10~130)
const mapCoord = (v) => {
  return 10 + Math.round((v - 15) * (120 / 100));
};

const drawLines = (lines) => {
  return lines.map(l => {
    const x1 = mapCoord(l[0]), y1 = mapCoord(l[1]);
    const x2 = mapCoord(l[2]), y2 = mapCoord(l[3]);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="3" stroke-linecap="round"/>`;
  }).join('');
};

// 線対称（左右反転: 70を中心にして反転）
const reflectLines = (lines) => {
  return lines.map(l => [130 - l[0], l[1], 130 - l[2], l[3]]);
};

pages.forEach(p => {
  let html = `
  <div class="page">
    <header>
      <div class="title">${studentName} てんずけい Vol. ${p.vol}（${p.titleType}）</div>
      <div class="name-box">なまえ：</div>
    </header>
    <div class="subtitle">${p.instruction}</div>
    <div class="grid-container">
  `;

  p.problems.forEach((prob, idx) => {
    let leftLinesHTML = drawLines(prob);
    if (p.mode === "reflect") {
      leftLinesHTML += drawLines(reflectLines(prob));
    }

    const axisClass = p.mode === "reflect" ? "axis-line dashed" : "axis-line solid";

    html += `
      <div class="problem-box">
        <div class="problem-title">だい ${idx + 1} もん</div>
        <div class="content">
