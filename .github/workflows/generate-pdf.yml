name: Generate PDF Worksheets

on:
  workflow_dispatch:
    inputs:
      student_name:
        description: "Student name"
        required: true
        default: "たろう"
        type: string
      sheet_count:
        description: "Number of sheets"
        required: true
        default: "3"
        type: string

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install --save-dev puppeteer

      - name: Generate worksheet HTML in temp
        run: |
          bash ./generate_worksheets.sh \
            --new-problem "${{ inputs.student_name }}" \
            --sheets "${{ inputs.sheet_count }}" \
            /tmp/worksheets.html

      - name: Convert HTML to PDF
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();
              await page.goto(`file:///tmp/worksheets.html`, {
                waitUntil: 'networkidle0',
                timeout: 60000
              });

              await page.pdf({
                path: '/tmp/worksheets.pdf',
                format: 'A4',
                printBackground: true,
                margin: {
                  top: '8mm',
                  bottom: '8mm',
                  left: '8mm',
                  right: '8mm'
                }
              });

              console.log('PDF generated: /tmp/worksheets.pdf');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove HTML file
        run: rm -f /tmp/worksheets.html

      - name: Upload PDF artifact only
        uses: actions/upload-artifact@v4
        with:
          name: worksheets-pdf
          path: /tmp/worksheets.pdf
          if-no-files-found: error
          retention-days: 30
