name: Generate Complex Geometry PDF

on:
  workflow_dispatch:
  workflow_call:

jobs:
  generate-pdf:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Puppeteer
        run: npm install --no-save --package-lock=false puppeteer@24.37.2

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate geometry worksheet HTML
        run: bash ./generate_complex_geometry.sh /tmp/complex_geometry.html

      - name: Convert HTML to PDF
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();
              await page.goto('file:///tmp/complex_geometry.html', {
                waitUntil: 'networkidle0',
                timeout: 60000
              });

              await page.pdf({
                path: '/tmp/complex_geometry.pdf',
                format: 'A4',
                printBackground: true,
                preferCSSPageSize: true,
                margin: {
                  top: '0',
                  bottom: '0',
                  left: '0',
                  right: '0'
                }
              });

              console.log('PDF generated: /tmp/complex_geometry.pdf');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove HTML file
        run: rm -f /tmp/complex_geometry.html

      - name: Upload PDF artifact only
        uses: actions/upload-artifact@v7
        with:
          name: complex-geometry-pdf
          path: /tmp/complex_geometry.pdf
          if-no-files-found: error
          retention-days: 30
